<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌟 משחק החשבון 🌟</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap');
    * { font-family: 'Rubik', sans-serif; }

    @keyframes bounceIn {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes confettiFall {
      0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes rainbow {
      0% { color: #ff6b6b; }
      16% { color: #ffa502; }
      33% { color: #ffd93d; }
      50% { color: #6bcb77; }
      66% { color: #4d96ff; }
      83% { color: #9b59b6; }
      100% { color: #ff6b6b; }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(180deg); }
    }
    @keyframes progressFill {
      from { width: 0%; }
    }
    @keyframes countDown {
      0% { transform: scale(1.5); opacity: 1; }
      100% { transform: scale(1); opacity: 0.6; }
    }
    .animate-bounceIn { animation: bounceIn 0.5s ease-out; }
    .animate-shake { animation: shake 0.5s ease-in-out; }
    .animate-float { animation: float 2s ease-in-out infinite; }
    .animate-starPulse { animation: starPulse 1s ease-in-out infinite; }
    .animate-slideUp { animation: slideUp 0.6s ease-out; }
    .animate-rainbow { animation: rainbow 3s linear infinite; }

    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      animation: confettiFall linear forwards;
      z-index: 100;
      pointer-events: none;
    }

    .sparkle-star {
      position: absolute;
      animation: sparkle 1.5s ease-in-out infinite;
      pointer-events: none;
      font-size: 1.2rem;
    }

    .btn-option {
      transition: all 0.2s ease;
    }
    .btn-option:hover {
      transform: scale(1.05);
    }
    .btn-option:active {
      transform: scale(0.95);
    }

    /* Memory Match card flip */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.4s ease;
      transform-style: preserve-3d;
    }
    .card-flipped .card-inner { transform: rotateY(180deg); }
    .card-matched .card-inner { transform: rotateY(180deg); }
    .card-matched .card-back { background: #d1fae5 !important; border-color: #34d399 !important; box-shadow: 0 0 12px rgba(52,211,153,0.5); }
    .card-front, .card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-back { transform: rotateY(180deg); }

    @keyframes popIn {
      0% { transform: scale(0); }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .animate-popIn { animation: popIn 0.3s ease-out; }

    @keyframes correctFlash {
      0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.7); }
      100% { box-shadow: 0 0 0 15px rgba(74,222,128,0); }
    }
    .animate-correctFlash { animation: correctFlash 0.6s ease-out; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-400 via-pink-300 to-yellow-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ===== Sound Effects =====
    const useSound = () => {
      const audioCtxRef = useRef(null);

      const getCtx = () => {
        if (!audioCtxRef.current) {
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        return audioCtxRef.current;
      };

      const playCorrect = useCallback(() => {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          const notes = [523.25, 659.25, 783.99, 1046.50];
          osc.frequency.setValueAtTime(notes[0], ctx.currentTime);
          osc.frequency.setValueAtTime(notes[1], ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(notes[2], ctx.currentTime + 0.2);
          osc.frequency.setValueAtTime(notes[3], ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.5);
        } catch(e) {}
      }, []);

      const playWrong = useCallback(() => {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'triangle';
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.setValueAtTime(200, ctx.currentTime + 0.2);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.4);
        } catch(e) {}
      }, []);

      const playClick = useCallback(() => {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.1);
        } catch(e) {}
      }, []);

      const playLevelUp = useCallback(() => {
        try {
          const ctx = getCtx();
          const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
          notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.15);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.15);
          });
        } catch(e) {}
      }, []);

      const playCelebration = useCallback(() => {
        try {
          const ctx = getCtx();
          for (let i = 0; i < 5; i++) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = i % 2 === 0 ? 'sine' : 'triangle';
            const baseFreq = 400 + Math.random() * 800;
            osc.frequency.setValueAtTime(baseFreq, ctx.currentTime + i * 0.15);
            osc.frequency.setValueAtTime(baseFreq * 1.5, ctx.currentTime + i * 0.15 + 0.1);
            gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.15 + 0.2);
            osc.start(ctx.currentTime + i * 0.15);
            osc.stop(ctx.currentTime + i * 0.15 + 0.2);
          }
        } catch(e) {}
      }, []);

      const playSad = useCallback(() => {
        try {
          const ctx = getCtx();
          const notes = [392.00, 349.23, 329.63, 293.66, 261.63];
          notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.25);
            gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.25);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.25 + 0.3);
            osc.start(ctx.currentTime + i * 0.25);
            osc.stop(ctx.currentTime + i * 0.25 + 0.3);
          });
        } catch(e) {}
      }, []);

      const playFlip = useCallback(() => {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.setValueAtTime(900, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
        } catch(e) {}
      }, []);

      const playMatch = useCallback(() => {
        try {
          const ctx = getCtx();
          [880, 1108.73, 1318.51].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.08 + 0.12);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.12);
          });
        } catch(e) {}
      }, []);

      const playPop = useCallback(() => {
        try {
          const ctx = getCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'square';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
        } catch(e) {}
      }, []);

      return { playCorrect, playWrong, playClick, playLevelUp, playCelebration, playSad, playFlip, playMatch, playPop };
    };

    // ===== Game Config =====
    const LEVEL_EMOJIS = ['🌱', '🌸', '🌟', '🔥', '⚡', '💎', '🚀', '🏆', '👑', '🌈'];
    const LEVEL_COLORS = [
      'from-green-400 to-emerald-500',
      'from-teal-400 to-cyan-500',
      'from-blue-400 to-indigo-500',
      'from-indigo-400 to-purple-500',
      'from-purple-400 to-pink-500',
      'from-pink-400 to-rose-500',
      'from-orange-400 to-red-500',
      'from-red-400 to-amber-500',
      'from-amber-400 to-yellow-500',
      'from-yellow-400 to-lime-500',
    ];
    const LEVELS = Array.from({ length: 10 }, (_, i) => ({
      id: `level${i + 1}`,
      name: `רמה ${i + 1}`,
      emoji: LEVEL_EMOJIS[i],
      max: (i + 1) * 10,
      color: LEVEL_COLORS[i],
      unlockScore: i === 0 ? 0 : 80,
    }));

    const OPERATIONS = [
      { id: 'add', name: 'חיבור', symbol: '+', emoji: '➕' },
      { id: 'sub', name: 'חיסור', symbol: '−', emoji: '➖' },
      { id: 'mul', name: 'כפל', symbol: '×', emoji: '✖️' },
    ];

    const ENCOURAGEMENTS_CORRECT = [
      '🎉 כל הכבוד!',
      '⭐ מדהים! אתם גאונים!',
      '🌟 וואו, מושלם!',
      '💪 חזקים עליכם!',
      '🏆 תשובה מעולה!',
      '✨ אתם כוכבים!',
      '🎯 בול פגיעה!',
      '🦄 קסום! מדהימים!',
      '🌈 נפלא!',
      '💖 סופר!',
    ];

    const ENCOURAGEMENTS_WRONG = [
      '💜 לא נורא, ננסה שוב!',
      '🌸 כמעט! אתם בדרך הנכונה!',
      '💪 אתם יכולים! בפעם הבאה!',
      '🦋 טעויות זה בסדר, ככה לומדים!',
      '🌺 לא נורא, המשיכו!',
      '⭐ אתם מתקדמים יפה!',
    ];

    const STREAK_MESSAGES = {
      3: '🔥 3 ברצף! אתם על אש!',
      5: '⚡ 5 ברצף! בלתי ניתנים לעצירה!',
      7: '🌟 7 ברצף! סופר-סטארים!',
      10: '👑 10 ברצף! מלכי החשבון!',
    };

    // ===== Images (base64) =====

    // ===== Helper Functions =====
    function generateQuestion(operation, maxResult) {
      let a, b, result;

      if (operation === 'add') {
        result = Math.floor(Math.random() * (maxResult + 1));
        a = Math.floor(Math.random() * (result + 1));
        b = result - a;
      } else if (operation === 'sub') {
        a = Math.floor(Math.random() * (maxResult + 1));
        b = Math.floor(Math.random() * (a + 1));
        result = a - b;
      } else {
        const maxFactor = Math.min(10, Math.floor(Math.sqrt(maxResult)));
        a = Math.floor(Math.random() * (maxFactor + 1));
        const maxB = a === 0 ? maxFactor : Math.min(maxFactor, Math.floor(maxResult / Math.max(a, 1)));
        b = Math.floor(Math.random() * (maxB + 1));
        result = a * b;
      }

      const symbol = OPERATIONS.find(o => o.id === operation).symbol;

      const wrongAnswers = new Set();
      while (wrongAnswers.size < 3) {
        let wrong;
        const offset = Math.floor(Math.random() * 8) - 4;
        wrong = result + (offset === 0 ? (Math.random() > 0.5 ? 1 : -1) : offset);
        if (wrong < 0) wrong = result + Math.floor(Math.random() * 5) + 1;
        if (wrong !== result && !wrongAnswers.has(wrong)) {
          wrongAnswers.add(wrong);
        }
      }

      const options = [...wrongAnswers, result].sort(() => Math.random() - 0.5);
      return { a, b, result, symbol, options, operation };
    }

    // ===== Confetti Component =====
    function Confetti({ active }) {
      const [pieces, setPieces] = useState([]);

      useEffect(() => {
        if (active) {
          const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6', '#ff9ff3', '#ffa502', '#00d2d3'];
          const newPieces = Array.from({ length: 50 }, (_, i) => ({
            id: i,
            left: Math.random() * 100,
            color: colors[Math.floor(Math.random() * colors.length)],
            delay: Math.random() * 2,
            duration: 2 + Math.random() * 3,
            size: 6 + Math.random() * 10,
            shape: Math.random() > 0.5 ? 'circle' : 'square',
          }));
          setPieces(newPieces);
        } else {
          setPieces([]);
        }
      }, [active]);

      return (
        <>
          {pieces.map(p => (
            <div
              key={p.id}
              className="confetti-piece"
              style={{
                left: `${p.left}%`,
                backgroundColor: p.color,
                width: `${p.size}px`,
                height: `${p.size}px`,
                borderRadius: p.shape === 'circle' ? '50%' : '2px',
                animationDelay: `${p.delay}s`,
                animationDuration: `${p.duration}s`,
                top: '-20px',
              }}
            />
          ))}
        </>
      );
    }

    // ===== Progress Bar =====
    function ProgressBar({ current, total }) {
      const pct = (current / total) * 100;
      return (
        <div className="w-full bg-white/30 rounded-full h-4 overflow-hidden backdrop-blur-sm">
          <div
            className="h-full bg-gradient-to-r from-yellow-400 via-pink-400 to-purple-500 rounded-full transition-all duration-700 ease-out relative"
            style={{ width: `${pct}%` }}
          >
            <div className="absolute inset-0 bg-white/20 animate-pulse rounded-full" />
          </div>
        </div>
      );
    }

    // ===== Star Rating =====
    function StarRating({ score, passPercent }) {
      const stars = score >= 90 ? 3 : score >= passPercent ? 2 : score >= (passPercent * 0.6) ? 1 : 0;
      return (
        <div className="flex gap-3 justify-center my-4">
          {[1, 2, 3].map(i => (
            <span
              key={i}
              className={`text-6xl ${i <= stars ? 'animate-starPulse' : 'opacity-30'}`}
              style={{ animationDelay: `${i * 0.2}s` }}
            >
              {i <= stars ? '⭐' : '☆'}
            </span>
          ))}
        </div>
      );
    }

    // ===== REWARD MINI-GAMES =====

    // --- 1. Memory Match ---
    function MemoryMatch({ onDone, sound }) {
      const allEmojis = ['🐶','🐱','🐸','🦁','🐰','🐼','🦊','🐵','🐮','🐷','🐔','🦄','🐙','🐬','🦋','🐞','🐢','🐘'];
      const emojis = useState(() => {
        const shuffled = [...allEmojis].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 6);
      })[0];
      const [cards, setCards] = useState(() => {
        const deck = [...emojis, ...emojis].map((emoji, i) => ({ id: i, emoji, flipped: false, matched: false }));
        for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
        return deck;
      });
      const [selected, setSelected] = useState([]);
      const [locked, setLocked] = useState(false);
      const [timer, setTimer] = useState(45);
      const [matchCount, setMatchCount] = useState(0);
      const [done, setDone] = useState(false);

      useEffect(() => {
        if (done) return;
        const t = setInterval(() => setTimer(p => {
          if (p <= 1) { clearInterval(t); setDone(true); return 0; }
          return p - 1;
        }), 1000);
        return () => clearInterval(t);
      }, [done]);

      useEffect(() => {
        if (matchCount === 6 && !done) {
          setDone(true);
          sound.playCelebration();
        }
      }, [matchCount]);

      useEffect(() => {
        if (done) { const t = setTimeout(onDone, 2500); return () => clearTimeout(t); }
      }, [done]);

      const handleClick = (idx) => {
        if (locked || cards[idx].flipped || cards[idx].matched || done) return;
        sound.playFlip();
        const newCards = [...cards];
        newCards[idx].flipped = true;
        setCards(newCards);
        const newSel = [...selected, idx];
        setSelected(newSel);

        if (newSel.length === 2) {
          setLocked(true);
          if (newCards[newSel[0]].emoji === newCards[newSel[1]].emoji) {
            setTimeout(() => {
              sound.playMatch();
              const c = [...newCards];
              c[newSel[0]].matched = true;
              c[newSel[1]].matched = true;
              setCards(c);
              setMatchCount(m => m + 1);
              setSelected([]);
              setLocked(false);
            }, 400);
          } else {
            setTimeout(() => {
              const c = [...newCards];
              c[newSel[0]].flipped = false;
              c[newSel[1]].flipped = false;
              setCards(c);
              setSelected([]);
              setLocked(false);
            }, 800);
          }
        }
      };

      return (
        <div className="min-h-screen p-4 flex flex-col items-center justify-center">
          <div className="text-center mb-4 animate-slideUp">
            <h2 className="text-3xl font-black text-white mb-2">🧠 משחק זיכרון!</h2>
            <p className="text-white/80 font-bold">מצאו את כל הזוגות!</p>
            <div className="flex gap-4 justify-center mt-2">
              <span className="bg-white/30 rounded-full px-4 py-1 text-white font-bold">⏱️ {timer}</span>
              <span className="bg-white/30 rounded-full px-4 py-1 text-white font-bold">✅ {matchCount}/6</span>
            </div>
          </div>
          <div className="grid grid-cols-4 gap-2 max-w-sm mx-auto" style={{ perspective: '1000px' }}>
            {cards.map((card, i) => (
              <div
                key={card.id}
                onClick={() => handleClick(i)}
                className={`w-20 h-20 md:w-24 md:h-24 cursor-pointer ${card.flipped || card.matched ? 'card-flipped' : ''} ${card.matched ? 'card-matched' : ''}`}
              >
                <div className="card-inner">
                  <div className="card-front bg-gradient-to-br from-indigo-400 to-purple-500 shadow-lg border-2 border-white/30">
                    <span className="text-2xl">❓</span>
                  </div>
                  <div className="card-back bg-white shadow-lg border-2 border-purple-200">
                    <span className="text-4xl">{card.emoji}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
          {done && (
            <div className="mt-4 animate-bounceIn text-center">
              <p className="text-2xl font-black text-white">
                {matchCount === 6 ? '🎉 מצאתם את כולם! 🎉' : `👏 מצאתם ${matchCount} זוגות!`}
              </p>
            </div>
          )}
          <button onClick={onDone} className="mt-4 bg-white/30 hover:bg-white/50 text-white font-bold rounded-full px-5 py-2">
            🏠 חזרה
          </button>
        </div>
      );
    }

    // --- 2. Pattern Sequence ---
    function PatternSequence({ onDone, sound }) {
      const allPatterns = [
        { seq: ['🔴','🔵','🔴','🔵'], answer: '🔴', options: ['🔴','🔵','🟢','🟡'] },
        { seq: ['🟡','🟡','🟢','🟡','🟡','🟢'], answer: '🟡', options: ['🟢','🟡','🔴','🔵'] },
        { seq: ['⭐','⭐⭐','⭐⭐⭐'], answer: '⭐⭐⭐⭐', options: ['⭐⭐⭐⭐','⭐⭐','⭐','⭐⭐⭐'] },
        { seq: ['🌙','🌙🌙','🌙🌙🌙'], answer: '🌙🌙🌙🌙', options: ['🌙🌙🌙🌙','🌙🌙','🌙','🌙🌙🌙🌙🌙'] },
        { seq: ['❤️','💛','❤️','💛'], answer: '❤️', options: ['💛','❤️','💚','💙'] },
        { seq: ['🐶','🐱','🐶','🐱'], answer: '🐶', options: ['🐱','🐶','🐸','🐰'] },
        { seq: ['1️⃣','2️⃣','3️⃣'], answer: '4️⃣', options: ['4️⃣','5️⃣','1️⃣','6️⃣'] },
        { seq: ['🔵','🟢','🟡','🔵','🟢','🟡'], answer: '🔵', options: ['🔵','🟡','🟢','🔴'] },
        { seq: ['🌸','🌸','🌺','🌸','🌸','🌺'], answer: '🌸', options: ['🌸','🌺','🌻','🌹'] },
        { seq: ['🍎','🍊','🍋','🍎','🍊','🍋'], answer: '🍎', options: ['🍎','🍊','🍋','🍇'] },
        { seq: ['🐟','🐟','🐠','🐟','🐟','🐠'], answer: '🐟', options: ['🐟','🐠','🐡','🦈'] },
        { seq: ['🌈','🌧️','🌈','🌧️'], answer: '🌈', options: ['🌈','🌧️','☀️','⛈️'] },
        { seq: ['🎈','🎈','🎁','🎈','🎈','🎁'], answer: '🎈', options: ['🎈','🎁','🎀','🎊'] },
        { seq: ['🔺','🔻','🔺','🔻'], answer: '🔺', options: ['🔺','🔻','⬛','⬜'] },
        { seq: ['🌻','🌻','🌹','🌻','🌻','🌹'], answer: '🌻', options: ['🌻','🌹','🌷','🌺'] },
        { seq: ['2️⃣','4️⃣','6️⃣'], answer: '8️⃣', options: ['8️⃣','7️⃣','9️⃣','5️⃣'] },
        { seq: ['🦋','🐛','🦋','🐛'], answer: '🦋', options: ['🦋','🐛','🐝','🐞'] },
        { seq: ['🚗','🚙','🚕','🚗','🚙','🚕'], answer: '🚗', options: ['🚗','🚙','🚕','🚌'] },
        { seq: ['🍕','🍔','🍕','🍔'], answer: '🍕', options: ['🍕','🍔','🌭','🍟'] },
        { seq: ['👋','👏','👋','👏'], answer: '👋', options: ['👋','👏','🤝','✋'] },
      ];
      const [rounds] = useState(() => {
        const shuffled = [...allPatterns].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 3);
      });
      const [current, setCurrent] = useState(0);
      const [score, setScore] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [done, setDone] = useState(false);

      useEffect(() => {
        if (done) { const t = setTimeout(onDone, 2500); return () => clearTimeout(t); }
      }, [done]);

      const handleAnswer = (ans) => {
        if (feedback) return;
        const correct = ans === rounds[current].answer;
        if (correct) { sound.playCorrect(); setScore(s => s + 1); }
        else { sound.playWrong(); }
        setFeedback(correct ? 'correct' : 'wrong');

        setTimeout(() => {
          setFeedback(null);
          if (current < 2) { setCurrent(c => c + 1); }
          else { setDone(true); sound.playCelebration(); }
        }, 1200);
      };

      const p = rounds[current];
      const shuffledOptions = useState(() => rounds.map(r => [...r.options].sort(() => Math.random() - 0.5)))[0];

      return (
        <div className="min-h-screen p-4 flex flex-col items-center justify-center">
          <div className="text-center mb-4 animate-slideUp">
            <h2 className="text-3xl font-black text-white mb-2">🧩 השלימו את הסדרה!</h2>
            <span className="bg-white/30 rounded-full px-4 py-1 text-white font-bold">שאלה {current + 1}/3</span>
          </div>
          {!done && (
            <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 max-w-md w-full text-center animate-slideUp">
              <div className="flex items-center justify-center gap-2 flex-wrap mb-6 text-3xl">
                {p.seq.map((item, i) => (
                  <span key={i} className="bg-purple-50 rounded-xl p-2 min-w-[50px]">{item}</span>
                ))}
                <span className="bg-yellow-100 rounded-xl p-2 min-w-[50px] border-2 border-dashed border-yellow-400 text-2xl font-black text-yellow-500">?</span>
              </div>
              <div className="grid grid-cols-2 gap-3">
                {shuffledOptions[current].map((opt, i) => (
                  <button
                    key={i}
                    onClick={() => handleAnswer(opt)}
                    className={`btn-option rounded-2xl p-4 text-2xl font-bold shadow-lg transition-all ${
                      feedback && opt === p.answer ? 'bg-green-400 text-white scale-110' :
                      feedback ? 'bg-gray-200 text-gray-400' :
                      'bg-gradient-to-br from-indigo-400 to-purple-500 text-white hover:shadow-xl'
                    }`}
                  >
                    {opt}
                  </button>
                ))}
              </div>
              {feedback && (
                <p className={`mt-3 text-xl font-bold ${feedback === 'correct' ? 'text-green-600' : 'text-red-500'}`}>
                  {feedback === 'correct' ? '✅ נכון!' : '❌ לא בדיוק...'}
                </p>
              )}
            </div>
          )}
          {done && (
            <div className="animate-bounceIn text-center">
              <p className="text-3xl font-black text-white">🎉 עניתם נכון על {score} מתוך 3! 🎉</p>
            </div>
          )}
          <button onClick={onDone} className="mt-4 bg-white/30 hover:bg-white/50 text-white font-bold rounded-full px-5 py-2">
            🏠 חזרה
          </button>
        </div>
      );
    }

    // --- 3. Spot the Difference ---
    function SpotDifference({ onDone, sound }) {
      const emojiPool = ['🌸','🌻','🍎','🍊','🐶','🐱','⭐','🌈','🎀','🦋','🍀','🌺','🎈','🐝','🍒','🐠'];
      const [grid] = useState(() => {
        const g = Array.from({ length: 16 }, () => emojiPool[Math.floor(Math.random() * emojiPool.length)]);
        return g;
      });
      const [diffIndices] = useState(() => {
        const indices = [];
        while (indices.length < 3) {
          const idx = Math.floor(Math.random() * 16);
          if (!indices.includes(idx)) indices.push(idx);
        }
        return indices;
      });
      const [modifiedGrid] = useState(() => {
        const g = [...grid];
        diffIndices.forEach(idx => {
          let newEmoji;
          do { newEmoji = emojiPool[Math.floor(Math.random() * emojiPool.length)]; } while (newEmoji === g[idx]);
          g[idx] = newEmoji;
        });
        return g;
      });
      const [found, setFound] = useState([]);
      const [timer, setTimer] = useState(45);
      const [done, setDone] = useState(false);
      const [wrongTap, setWrongTap] = useState(null);

      useEffect(() => {
        if (done) return;
        const t = setInterval(() => setTimer(p => {
          if (p <= 1) { clearInterval(t); setDone(true); return 0; }
          return p - 1;
        }), 1000);
        return () => clearInterval(t);
      }, [done]);

      useEffect(() => {
        if (found.length === 3 && !done) { setDone(true); sound.playCelebration(); }
      }, [found]);

      useEffect(() => {
        if (done) { const t = setTimeout(onDone, 2500); return () => clearTimeout(t); }
      }, [done]);

      const handleTap = (idx) => {
        if (done || found.includes(idx)) return;
        if (diffIndices.includes(idx)) {
          sound.playMatch();
          setFound(f => [...f, idx]);
        } else {
          sound.playPop();
          setWrongTap(idx);
          setTimeout(() => setWrongTap(null), 400);
        }
      };

      const renderGrid = (g, clickable) => (
        <div className="grid grid-cols-4 gap-1">
          {g.map((emoji, i) => (
            <div
              key={i}
              onClick={clickable ? () => handleTap(i) : undefined}
              className={`w-12 h-12 md:w-14 md:h-14 flex items-center justify-center rounded-lg text-xl md:text-2xl transition-all
                ${clickable ? 'cursor-pointer hover:bg-yellow-100' : ''}
                ${clickable && found.includes(i) ? 'bg-green-200 ring-2 ring-green-500 animate-correctFlash' : 'bg-white'}
                ${clickable && wrongTap === i ? 'animate-shake bg-red-100' : ''}
              `}
            >
              {emoji}
            </div>
          ))}
        </div>
      );

      return (
        <div className="min-h-screen p-4 flex flex-col items-center justify-center">
          <div className="text-center mb-4 animate-slideUp">
            <h2 className="text-3xl font-black text-white mb-2">🔍 מצאו את ההבדלים!</h2>
            <p className="text-white/80 font-bold">לחצו על ההבדלים בצד ימין</p>
            <div className="flex gap-4 justify-center mt-2">
              <span className="bg-white/30 rounded-full px-4 py-1 text-white font-bold">⏱️ {timer}</span>
              <span className="bg-white/30 rounded-full px-4 py-1 text-white font-bold">✅ {found.length}/3</span>
            </div>
          </div>
          <div className="flex gap-4 items-start animate-slideUp">
            <div className="text-center">
              <p className="text-white font-bold mb-2 text-sm">מקור</p>
              <div className="bg-white/80 rounded-2xl p-2 shadow-xl">{renderGrid(grid, false)}</div>
            </div>
            <div className="text-center">
              <p className="text-white font-bold mb-2 text-sm">מצאו הבדלים 👆</p>
              <div className="bg-white/80 rounded-2xl p-2 shadow-xl">{renderGrid(modifiedGrid, true)}</div>
            </div>
          </div>
          {done && (
            <div className="mt-4 animate-bounceIn text-center">
              <p className="text-2xl font-black text-white">
                {found.length === 3 ? '🎉 מצאתם את כולם! 🎉' : `👏 מצאתם ${found.length} מתוך 3!`}
              </p>
            </div>
          )}
          <button onClick={onDone} className="mt-4 bg-white/30 hover:bg-white/50 text-white font-bold rounded-full px-5 py-2">
            🏠 חזרה
          </button>
        </div>
      );
    }

    // --- 4. Word Scramble (Hebrew) ---
    function WordScramble({ onDone, sound }) {
      const allWords = [
        { word: 'כלב', emoji: '🐶' },
        { word: 'חתול', emoji: '🐱' },
        { word: 'פרח', emoji: '🌸' },
        { word: 'בית', emoji: '🏠' },
        { word: 'שמש', emoji: '☀️' },
        { word: 'ספר', emoji: '📖' },
        { word: 'דג', emoji: '🐟' },
        { word: 'עץ', emoji: '🌳' },
        { word: 'כדור', emoji: '⚽' },
        { word: 'לב', emoji: '❤️' },
        { word: 'ילד', emoji: '👦' },
        { word: 'ילדה', emoji: '👧' },
        { word: 'גשם', emoji: '🌧️' },
        { word: 'כוכב', emoji: '⭐' },
        { word: 'ירח', emoji: '🌙' },
        { word: 'תפוח', emoji: '🍎' },
        { word: 'דוב', emoji: '🐻' },
        { word: 'ציפור', emoji: '🐦' },
        { word: 'אריה', emoji: '🦁' },
        { word: 'פיל', emoji: '🐘' },
        { word: 'צבע', emoji: '🎨' },
        { word: 'מים', emoji: '💧' },
        { word: 'אבן', emoji: '🪨' },
        { word: 'רכב', emoji: '🚗' },
        { word: 'עוגה', emoji: '🎂' },
      ];
      const [rounds] = useState(() => {
        const shuffled = [...allWords].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 3);
      });
      const [current, setCurrent] = useState(0);
      const [scrambled, setScrambled] = useState(() => {
        const letters = rounds[0].word.split('');
        for (let i = letters.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [letters[i],letters[j]]=[letters[j],letters[i]]; }
        return letters;
      });
      const [selected, setSelected] = useState([]);
      const [available, setAvailable] = useState(() => scrambled.map((_, i) => i));
      const [feedback, setFeedback] = useState(null);
      const [score, setScore] = useState(0);
      const [done, setDone] = useState(false);

      const setupRound = (roundIdx) => {
        const letters = rounds[roundIdx].word.split('');
        for (let i = letters.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [letters[i],letters[j]]=[letters[j],letters[i]]; }
        setScrambled(letters);
        setSelected([]);
        setAvailable(letters.map((_, i) => i));
        setFeedback(null);
      };

      useEffect(() => {
        if (done) { const t = setTimeout(onDone, 2500); return () => clearTimeout(t); }
      }, [done]);

      const handleLetterTap = (scrIdx) => {
        if (feedback || !available.includes(scrIdx)) return;
        sound.playFlip();
        const newSel = [...selected, scrIdx];
        setSelected(newSel);
        setAvailable(available.filter(i => i !== scrIdx));

        // Check if word is complete
        if (newSel.length === scrambled.length) {
          const built = newSel.map(i => scrambled[i]).join('');
          const correct = built === rounds[current].word;
          if (correct) {
            sound.playCorrect();
            setScore(s => s + 1);
            setFeedback('correct');
          } else {
            sound.playWrong();
            setFeedback('wrong');
          }
          setTimeout(() => {
            if (current < 2) {
              const next = current + 1;
              setCurrent(next);
              setupRound(next);
            } else {
              setDone(true);
              sound.playCelebration();
            }
          }, 1200);
        }
      };

      const handleUndo = () => {
        if (selected.length === 0 || feedback) return;
        const last = selected[selected.length - 1];
        setSelected(selected.slice(0, -1));
        setAvailable([...available, last]);
      };

      const r = rounds[current];
      return (
        <div className="min-h-screen p-4 flex flex-col items-center justify-center">
          <div className="text-center mb-4 animate-slideUp">
            <h2 className="text-3xl font-black text-white mb-2">🔤 סדרו את המילה!</h2>
            <span className="bg-white/30 rounded-full px-4 py-1 text-white font-bold">מילה {current + 1}/3</span>
          </div>
          {!done && (
            <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 max-w-md w-full text-center animate-slideUp">
              <div className="text-7xl mb-4">{r.emoji}</div>

              {/* Built word so far */}
              <div className="flex justify-center gap-2 mb-6 min-h-[60px]" dir="rtl">
                {rounds[current].word.split('').map((_, i) => (
                  <div key={i} className={`w-12 h-14 rounded-xl border-2 flex items-center justify-center text-2xl font-black
                    ${i < selected.length ? 'bg-purple-100 border-purple-400' : 'bg-gray-50 border-dashed border-gray-300'}`}>
                    {i < selected.length ? scrambled[selected[i]] : ''}
                  </div>
                ))}
              </div>

              {/* Scrambled letters to tap */}
              <div className="flex justify-center gap-2 mb-4" dir="rtl">
                {scrambled.map((letter, i) => (
                  <button
                    key={i}
                    onClick={() => handleLetterTap(i)}
                    disabled={!available.includes(i)}
                    className={`btn-option w-14 h-14 rounded-xl text-2xl font-black shadow-md transition-all
                      ${available.includes(i) ? 'bg-gradient-to-br from-pink-400 to-purple-500 text-white hover:shadow-lg' : 'bg-gray-200 text-gray-300'}`}
                  >
                    {letter}
                  </button>
                ))}
              </div>

              <button onClick={handleUndo} className="text-purple-500 font-bold text-lg hover:text-purple-700">
                ↩️ בטל
              </button>

              {feedback && (
                <p className={`mt-3 text-xl font-bold animate-bounceIn ${feedback === 'correct' ? 'text-green-600' : 'text-red-500'}`}>
                  {feedback === 'correct' ? `✅ ${r.word} - נכון!` : `❌ המילה היא: ${r.word}`}
                </p>
              )}
            </div>
          )}
          {done && (
            <div className="animate-bounceIn text-center">
              <p className="text-3xl font-black text-white">🎉 סידרתם {score} מילים נכון! 🎉</p>
            </div>
          )}
          <button onClick={onDone} className="mt-4 bg-white/30 hover:bg-white/50 text-white font-bold rounded-full px-5 py-2">
            🏠 חזרה
          </button>
        </div>
      );
    }

    // ===== Main App =====
    function App() {
      const [screen, setScreen] = useState('home');
      const [selectedLevel, setSelectedLevel] = useState(null);
      const [questions, setQuestions] = useState([]);
      const [currentQ, setCurrentQ] = useState(0);
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [maxStreak, setMaxStreak] = useState(0);
      const [totalPoints, setTotalPoints] = useState(() => {
        try { return parseInt(localStorage.getItem('ella_points') || '0'); } catch { return 0; }
      });
      const [levelScores, setLevelScores] = useState(() => {
        try { return JSON.parse(localStorage.getItem('ella_levels') || '{}'); } catch { return {}; }
      });
      const [gameHistory, setGameHistory] = useState(() => {
        try { return JSON.parse(localStorage.getItem('ella_history') || '[]'); } catch { return []; }
      });
      const [feedback, setFeedback] = useState(null);
      const [streakMsg, setStreakMsg] = useState(null);
      const [answered, setAnswered] = useState(false);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showConfetti, setShowConfetti] = useState(false);

      // Settings
      const [numQuestions, setNumQuestions] = useState(() => {
        try { return parseInt(localStorage.getItem('ella_numQ') || '10'); } catch { return 10; }
      });
      const [passPercent, setPassPercent] = useState(() => {
        try { return parseInt(localStorage.getItem('ella_pass') || '80'); } catch { return 80; }
      });
      const [showSettings, setShowSettings] = useState(false);
      const [showHistory, setShowHistory] = useState(false);
      const [retryCountdown, setRetryCountdown] = useState(null);
      const [showPhoto, setShowPhoto] = useState(null); // 'happy' | 'sad' | null
      const [showBriefing, setShowBriefing] = useState(false);
      const [errors, setErrors] = useState(0);
      const [rewardGame, setRewardGame] = useState(0);
      const [showRewardIntro, setShowRewardIntro] = useState(false);

      const sound = useSound();

      // Save progress
      useEffect(() => {
        try {
          localStorage.setItem('ella_points', String(totalPoints));
          localStorage.setItem('ella_levels', JSON.stringify(levelScores));
          localStorage.setItem('ella_history', JSON.stringify(gameHistory));
          localStorage.setItem('ella_numQ', String(numQuestions));
          localStorage.setItem('ella_pass', String(passPercent));
        } catch {}
      }, [totalPoints, levelScores, gameHistory, numQuestions, passPercent]);

      const isLevelUnlocked = (levelIdx) => {
        if (levelIdx === 0) return true;
        const prevLevel = LEVELS[levelIdx - 1];
        const prevBest = levelScores[prevLevel.id];
        return prevBest && prevBest.score >= passPercent;
      };

      const startGame = (level) => {
        sound.playClick();
        setSelectedLevel(level);
        const opIds = ['add', 'sub', 'mul'];
        const qs = [];
        const seen = new Set();
        let attempts = 0;
        while (qs.length < numQuestions && attempts < numQuestions * 20) {
          attempts++;
          const randomOp = opIds[Math.floor(Math.random() * opIds.length)];
          const q = generateQuestion(randomOp, level.max);
          const key = `${q.a}${q.symbol}${q.b}`;
          if (!seen.has(key)) {
            seen.add(key);
            qs.push(q);
          }
        }
        // Fallback: if not enough unique questions, fill remaining
        while (qs.length < numQuestions) {
          const randomOp = opIds[Math.floor(Math.random() * opIds.length)];
          qs.push(generateQuestion(randomOp, level.max));
        }
        setQuestions(qs);
        setCurrentQ(0);
        setScore(0);
        setStreak(0);
        setMaxStreak(0);
        setErrors(0);
        setFeedback(null);
        setStreakMsg(null);
        setAnswered(false);
        setSelectedAnswer(null);
        setShowConfetti(false);
        setRetryCountdown(null);
        setShowPhoto(null);
        setShowBriefing(true);
        setScreen('game');

        // Auto-dismiss briefing after 3 seconds
        setTimeout(() => {
          setShowBriefing(false);
        }, 3000);
      };

      const addToHistory = (level, finalScore, pct, didPass) => {
        const entry = {
          date: new Date().toLocaleDateString('he-IL'),
          time: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }),
          level: level.name,
          emoji: level.emoji,
          questions: numQuestions,
          required: passPercent,
          correct: finalScore,
          pct,
          passed: didPass,
        };
        setGameHistory(prev => [entry, ...prev].slice(0, 10));
      };

      const handleAnswer = (answer) => {
        if (answered) return;
        setAnswered(true);
        setSelectedAnswer(answer);

        const correct = answer === questions[currentQ].result;

        if (correct) {
          sound.playCorrect();
          const newStreak = streak + 1;
          setStreak(newStreak);
          if (newStreak > maxStreak) setMaxStreak(newStreak);
          setScore(s => s + 1);

          const pointsEarned = 10 * (1 + Math.floor(newStreak / 3));
          setTotalPoints(p => p + pointsEarned);

          setFeedback({
            type: 'correct',
            message: ENCOURAGEMENTS_CORRECT[Math.floor(Math.random() * ENCOURAGEMENTS_CORRECT.length)],
            points: pointsEarned,
          });

          if (STREAK_MESSAGES[newStreak]) {
            setStreakMsg(STREAK_MESSAGES[newStreak]);
            setTimeout(() => setStreakMsg(null), 2500);
          }

          setShowConfetti(true);
          setTimeout(() => setShowConfetti(false), 2000);
        } else {
          sound.playWrong();
          setStreak(0);
          const newErrors = errors + 1;
          setErrors(newErrors);
          setFeedback({
            type: 'wrong',
            message: ENCOURAGEMENTS_WRONG[Math.floor(Math.random() * ENCOURAGEMENTS_WRONG.length)],
            correctAnswer: questions[currentQ].result,
          });

          // Check if too many errors to pass
          const maxAllowedErrors = numQuestions - Math.ceil(numQuestions * passPercent / 100);
          if (newErrors > maxAllowedErrors) {
            // Can't pass anymore — early fail
            const finalScore = score;
            const pct = Math.round((finalScore / numQuestions) * 100);
            addToHistory(selectedLevel, finalScore, pct, false);

            setTimeout(() => {
              sound.playSad();
              setShowPhoto('sad');
              setFeedback(null);

              setTimeout(() => {
                setShowPhoto(null);
                startGame(selectedLevel);
              }, 3000);
            }, 1500);
            return;
          }
        }

        setTimeout(() => {
          if (currentQ < numQuestions - 1) {
            setCurrentQ(q => q + 1);
            setFeedback(null);
            setAnswered(false);
            setSelectedAnswer(null);
          } else {
            const finalScore = correct ? score + 1 : score;
            const pct = Math.round((finalScore / numQuestions) * 100);
            const didPass = pct >= passPercent;

            const key = selectedLevel.id;
            if (didPass) {
              setLevelScores(prev => {
                const existing = prev[key];
                if (!existing || pct > existing.score) {
                  return { ...prev, [key]: { level: selectedLevel.id, score: pct } };
                }
                return prev;
              });
            }

            addToHistory(selectedLevel, finalScore, pct, didPass);

            if (didPass) {
              sound.playCelebration();
              setShowPhoto('happy');
              setShowConfetti(true);
            } else {
              sound.playSad();
              setShowPhoto('sad');
              setShowConfetti(false);
            }

            setTimeout(() => {
              setShowPhoto(null);
              setShowConfetti(false);
              if (didPass) {
                setRewardGame(Math.floor(Math.random() * 4));
                setShowRewardIntro(true);
                setScreen('reward');
              } else {
                startGame(selectedLevel);
              }
            }, 3000);
          }
        }, 1800);
      };

      const goHome = () => {
        sound.playClick();
        setScreen('home');
        setShowConfetti(false);
        setRetryCountdown(null);
        setShowPhoto(null);
      };

      // ===== PHOTO OVERLAY (must be first — overrides any screen) =====
      if (showPhoto) {
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm">
            <Confetti active={showPhoto === 'happy'} />
            <div className="animate-bounceIn text-center">
              <img
                src={showPhoto === 'happy' ? IMG_HAPPY : IMG_SAD}
                alt={showPhoto === 'happy' ? 'שמחה' : 'עצובה'}
                className="max-w-xs md:max-w-sm rounded-3xl shadow-2xl border-4 mx-auto"
                style={{ borderColor: showPhoto === 'happy' ? '#4ade80' : '#f87171' }}
              />
              <p className={`text-3xl font-black mt-4 ${showPhoto === 'happy' ? 'text-green-400' : 'text-red-300'}`}>
                {showPhoto === 'happy'
                  ? '🎉 כל הכבוד! הצלחתם! 🎉'
                  : '💜 לא נורא, ננסה שוב! 💪'}
              </p>
            </div>
          </div>
        );
      }

      // ===== MISSION BRIEFING =====
      if (showBriefing && selectedLevel) {
        const needed = Math.ceil(numQuestions * passPercent / 100);
        const maxErrors = numQuestions - needed;
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="animate-bounceIn text-center max-w-md">
              <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-8">
                <div className="text-6xl mb-4">🎯</div>
                <h2 className="text-3xl font-black text-purple-700 mb-4">המשימה שלכם!</h2>
                <div className="bg-purple-50 rounded-2xl p-5 mb-4 space-y-3">
                  <p className="text-xl text-gray-700">
                    {selectedLevel.emoji} רמה: <span className="font-bold">{selectedLevel.name}</span>
                  </p>
                  <p className="text-xl text-gray-700">
                    📝 מספר שאלות: <span className="font-black text-purple-600 text-2xl">{numQuestions}</span>
                  </p>
                  <p className="text-xl text-gray-700">
                    ✅ צריך לענות נכון על: <span className="font-black text-green-600 text-2xl">{needed}</span> שאלות
                  </p>
                  <p className="text-xl text-gray-700">
                    ❌ מותר לטעות רק: <span className="font-black text-red-500 text-2xl">{maxErrors}</span> פעמים
                  </p>
                </div>
                <p className="text-2xl font-bold text-pink-500 animate-float">💪 אתם יכולים! 💪</p>
              </div>
            </div>
          </div>
        );
      }

      // ===== REWARD INTRO (gift screen) =====
      if (screen === 'reward' && showRewardIntro) {
        const gameNames = ['🧠 משחק זיכרון', '🧩 השלמת סדרות', '🔍 מצאו הבדלים', '🔤 סידור מילים'];
        setTimeout(() => setShowRewardIntro(false), 3000);
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="animate-bounceIn text-center">
              <div className="text-8xl mb-6 animate-float">🎁</div>
              <h2 className="text-4xl font-black text-white mb-3">קיבלתם פרס!</h2>
              <p className="text-2xl text-white/90 font-bold mb-4">{gameNames[rewardGame]}</p>
              <div className="text-5xl animate-float" style={{ animationDelay: '0.5s' }}>🎉🌟🎉</div>
            </div>
          </div>
        );
      }

      // ===== REWARD MINI-GAME =====
      if (screen === 'reward') {
        const games = [MemoryMatch, PatternSequence, SpotDifference, WordScramble];
        const RewardGame = games[rewardGame];
        return <RewardGame onDone={() => { sound.playClick(); setScreen('home'); }} sound={sound} />;
      }

      // ===== HOME SCREEN =====
      if (screen === 'home') {
        return (
          <div className="min-h-screen p-4 flex flex-col items-center">
            <Confetti active={false} />

            {/* Header */}
            <div className="text-center mb-6 animate-slideUp">
              <h1 className="text-5xl md:text-6xl font-black text-white drop-shadow-lg mb-2">
                🎀 משחק החשבון 🎀
              </h1>
              <p className="text-2xl text-white/90 font-bold">✨ בואו נלמד חשבון ביחד! ✨</p>
              <div className="mt-3 flex items-center justify-center gap-3">
                <div className="inline-flex items-center gap-2 bg-white/30 backdrop-blur-sm rounded-full px-5 py-2">
                  <span className="text-2xl">💎</span>
                  <span className="text-xl font-bold text-purple-800">{totalPoints.toLocaleString()} נקודות</span>
                </div>
              </div>
            </div>

            <div className="w-full max-w-2xl space-y-4">

              {/* Settings + History toggle buttons */}
              <div className="flex gap-3 justify-center">
                <button
                  onClick={() => { setShowSettings(!showSettings); setShowHistory(false); }}
                  className={`btn-option rounded-2xl px-5 py-2 font-bold text-lg shadow-lg transition-all ${
                    showSettings ? 'bg-white text-purple-600' : 'bg-white/30 text-white hover:bg-white/50'
                  }`}
                >
                  ⚙️ הגדרות
                </button>
                <button
                  onClick={() => { setShowHistory(!showHistory); setShowSettings(false); }}
                  className={`btn-option rounded-2xl px-5 py-2 font-bold text-lg shadow-lg transition-all ${
                    showHistory ? 'bg-white text-purple-600' : 'bg-white/30 text-white hover:bg-white/50'
                  }`}
                >
                  📋 תוצאות אחרונות
                </button>
              </div>

              {/* Settings Panel */}
              {showSettings && (
                <div className="bg-white/90 backdrop-blur-md rounded-3xl p-5 shadow-xl animate-slideUp">
                  <h3 className="text-xl font-bold text-purple-700 mb-4 text-center">⚙️ הגדרות משחקון</h3>

                  <div className="space-y-5">
                    {/* Number of questions */}
                    <div>
                      <label className="text-gray-700 font-bold block mb-2">
                        📝 מספר שאלות במשחקון: <span className="text-purple-600 text-2xl">{numQuestions}</span>
                      </label>
                      <input
                        type="range"
                        min="5"
                        max="50"
                        step="5"
                        value={numQuestions}
                        onChange={(e) => setNumQuestions(parseInt(e.target.value))}
                        className="w-full h-3 bg-purple-200 rounded-lg appearance-none cursor-pointer accent-purple-500"
                      />
                      <div className="flex justify-between text-sm text-gray-400 mt-1">
                        <span>5</span>
                        <span>15</span>
                        <span>25</span>
                        <span>35</span>
                        <span>50</span>
                      </div>
                    </div>

                    {/* Pass percentage */}
                    <div>
                      <label className="text-gray-700 font-bold block mb-2">
                        🎯 אחוז הצלחה נדרש: <span className="text-purple-600 text-2xl">{passPercent}%</span>
                      </label>
                      <input
                        type="range"
                        min="50"
                        max="100"
                        step="5"
                        value={passPercent}
                        onChange={(e) => setPassPercent(parseInt(e.target.value))}
                        className="w-full h-3 bg-pink-200 rounded-lg appearance-none cursor-pointer accent-pink-500"
                      />
                      <div className="flex justify-between text-sm text-gray-400 mt-1">
                        <span>50%</span>
                        <span>65%</span>
                        <span>80%</span>
                        <span>90%</span>
                        <span>100%</span>
                      </div>
                    </div>

                    {/* Summary */}
                    <div className="bg-purple-50 rounded-2xl p-3 text-center">
                      <p className="text-gray-600">
                        כדי לעבור צריך לענות נכון על לפחות{' '}
                        <span className="font-black text-purple-600 text-xl">
                          {Math.ceil(numQuestions * passPercent / 100)}
                        </span>
                        {' '}שאלות מתוך {numQuestions}
                      </p>
                    </div>
                  </div>
                </div>
              )}

              {/* History Panel */}
              {showHistory && (
                <div className="bg-white/90 backdrop-blur-md rounded-3xl p-5 shadow-xl animate-slideUp">
                  <h3 className="text-xl font-bold text-purple-700 mb-4 text-center">📋 10 משחקים אחרונים</h3>

                  {gameHistory.length === 0 ? (
                    <p className="text-center text-gray-400 py-4">עדיין אין משחקים 🎮</p>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="border-b-2 border-purple-200">
                            <th className="py-2 px-2 text-right text-purple-600">תאריך</th>
                            <th className="py-2 px-2 text-right text-purple-600">רמה</th>
                            <th className="py-2 px-2 text-center text-purple-600">שאלות</th>
                            <th className="py-2 px-2 text-center text-purple-600">נדרש</th>
                            <th className="py-2 px-2 text-center text-purple-600">נכונות</th>
                            <th className="py-2 px-2 text-center text-purple-600">תוצאה</th>
                          </tr>
                        </thead>
                        <tbody>
                          {gameHistory.map((g, i) => (
                            <tr key={i} className={`border-b border-gray-100 ${g.passed ? 'bg-green-50' : 'bg-red-50'}`}>
                              <td className="py-2 px-2 text-gray-500 text-xs">
                                {g.date}<br/>{g.time}
                              </td>
                              <td className="py-2 px-2 font-bold">
                                {g.emoji} {g.level}
                              </td>
                              <td className="py-2 px-2 text-center font-bold">{g.questions}</td>
                              <td className="py-2 px-2 text-center font-bold">{g.required}%</td>
                              <td className="py-2 px-2 text-center">
                                <span className="font-black text-lg">{g.correct}</span>
                                <span className="text-gray-400">/{g.questions}</span>
                                <span className="block text-xs text-gray-500">{g.pct}%</span>
                              </td>
                              <td className="py-2 px-2 text-center text-2xl">
                                {g.passed ? '✅' : '❌'}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}

              {/* Levels */}
              {LEVELS.map((level, idx) => {
                const unlocked = isLevelUnlocked(idx);
                return (
                  <div
                    key={level.id}
                    className={`rounded-3xl p-5 shadow-xl transition-all duration-300 ${
                      unlocked
                        ? `bg-gradient-to-r ${level.color} hover:scale-[1.02] cursor-pointer`
                        : 'bg-gray-400/50 opacity-60'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-3">
                        <span className="text-4xl">{unlocked ? level.emoji : '🔒'}</span>
                        <div>
                          <h2 className="text-2xl font-bold text-white">{level.name}</h2>
                          <p className="text-white/80 text-sm">תוצאות עד {level.max}</p>
                        </div>
                      </div>
                      {!unlocked && (
                        <span className="text-white/80 text-sm bg-black/20 rounded-full px-3 py-1">
                          צריך {passPercent}% ברמה הקודמת 🔒
                        </span>
                      )}
                    </div>

                    {unlocked && (
                      <div className="flex items-center gap-3">
                        <button
                          onClick={() => startGame(level)}
                          className="btn-option flex-1 bg-white/25 hover:bg-white/40 backdrop-blur-sm
                                     rounded-2xl p-4 text-center border-2 border-white/30
                                     hover:border-white/60 transition-all"
                        >
                          <span className="text-2xl">🎮</span>
                          <span className="text-white font-bold text-xl mr-2">התחילו לשחק!</span>
                          <span className="text-white/70 text-sm block mt-1">➕ חיבור &nbsp; ➖ חיסור &nbsp; ✖️ כפל &nbsp;•&nbsp; {numQuestions} שאלות</span>
                        </button>
                        {levelScores[level.id] && (
                          <div className="bg-white/20 rounded-2xl p-3 text-center min-w-[80px]">
                            <span className="text-2xl block">🏆</span>
                            <span className="text-white font-bold block">{levelScores[level.id].score}%</span>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Footer mascot */}
            <div className="mt-6 animate-float">
              <span className="text-6xl">🦄</span>
            </div>
          </div>
        );
      }

      // ===== GAME SCREEN =====
      if (screen === 'game') {
        const q = questions[currentQ];
        const opEmoji = q.operation === 'add' ? '➕' : q.operation === 'sub' ? '➖' : '✖️';

        return (
          <div className="min-h-screen p-4 flex flex-col items-center justify-center">
            <Confetti active={showConfetti} />

            {/* Streak message overlay */}
            {streakMsg && (
              <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 animate-bounceIn">
                <div className="bg-gradient-to-r from-orange-400 to-red-500 text-white text-xl font-bold
                               rounded-full px-6 py-3 shadow-2xl">
                  {streakMsg}
                </div>
              </div>
            )}

            {/* Top bar */}
            <div className="w-full max-w-lg mb-4">
              <div className="flex justify-between items-center mb-2">
                <button
                  onClick={goHome}
                  className="bg-white/30 hover:bg-white/50 backdrop-blur-sm rounded-full px-4 py-2
                             text-white font-bold transition-all hover:scale-105"
                >
                  🏠 חזרה
                </button>
                <div className="flex items-center gap-3">
                  <div className="bg-white/30 backdrop-blur-sm rounded-full px-4 py-2 flex items-center gap-2">
                    <span>🔥</span>
                    <span className="font-bold text-white">{streak}</span>
                  </div>
                  <div className="bg-white/30 backdrop-blur-sm rounded-full px-4 py-2 flex items-center gap-2">
                    <span>⭐</span>
                    <span className="font-bold text-white">{score}/{currentQ + (answered ? 1 : 0)}</span>
                  </div>
                  {(() => {
                    const maxAllowed = numQuestions - Math.ceil(numQuestions * passPercent / 100);
                    const remaining = maxAllowed - errors;
                    const isLast = remaining === 1;
                    const isDanger = remaining <= 0;
                    return (
                      <div className={`backdrop-blur-sm rounded-full px-3 py-2 flex items-center gap-1 text-sm transition-all ${
                        isDanger ? 'bg-red-500/60' : isLast ? 'bg-red-400/50 animate-pulse' : 'bg-white/30'
                      }`}>
                        <span>{isDanger ? '🚫' : isLast ? '⚠️' : '❌'}</span>
                        <span className={`font-bold ${isDanger ? 'text-red-100' : isLast ? 'text-yellow-100' : 'text-white'}`}>
                          {remaining < 0 ? 0 : remaining} טעויות
                        </span>
                      </div>
                    );
                  })()}
                </div>
              </div>

              {/* Progress */}
              <div className="flex items-center gap-2 mb-1">
                <span className="text-white/80 text-sm font-bold">שאלה {currentQ + 1}/{numQuestions}</span>
                <span className="text-white/60 text-sm">
                  {selectedLevel.emoji} {selectedLevel.name} • {opEmoji}
                </span>
              </div>
              <ProgressBar current={currentQ + 1} total={numQuestions} />
            </div>

            {/* Question Card */}
            <div className={`w-full max-w-lg ${feedback?.type === 'wrong' ? 'animate-shake' : ''}`}>
              <div className="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8 text-center">
                {/* Question */}
                <div className="mb-6">
                  <span className="text-lg text-purple-500 font-bold mb-2 block">
                    🤔 כמה זה...?
                  </span>
                  <div className="text-5xl md:text-6xl font-black text-gray-800 my-4 tracking-wide" dir="ltr">
                    {q.a} {q.symbol} {q.b} = ?
                  </div>
                </div>

                {/* Options */}
                <div className="grid grid-cols-2 gap-3 mb-4">
                  {q.options.map((opt, i) => {
                    let btnClass = 'bg-gradient-to-br from-indigo-400 to-purple-500 text-white border-2 border-indigo-300';

                    if (answered) {
                      if (opt === q.result) {
                        btnClass = 'bg-gradient-to-br from-green-400 to-emerald-500 text-white border-2 border-green-300 scale-110';
                      } else if (opt === selectedAnswer && opt !== q.result) {
                        btnClass = 'bg-gradient-to-br from-red-400 to-rose-500 text-white border-2 border-red-300';
                      } else {
                        btnClass = 'bg-gray-200 text-gray-400 border-2 border-gray-200';
                      }
                    }

                    return (
                      <button
                        key={i}
                        onClick={() => handleAnswer(opt)}
                        disabled={answered}
                        className={`btn-option ${btnClass} rounded-2xl p-4 text-3xl md:text-4xl font-black
                                   shadow-lg transition-all duration-300 ${answered ? '' : 'hover:shadow-xl active:scale-95'}`}
                      >
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {/* Feedback */}
                {feedback && (
                  <div className={`animate-bounceIn rounded-2xl p-4 mt-4 ${
                    feedback.type === 'correct'
                      ? 'bg-green-100 border-2 border-green-300'
                      : 'bg-red-50 border-2 border-red-200'
                  }`}>
                    <p className="text-xl font-bold mb-1">
                      {feedback.message}
                    </p>
                    {feedback.type === 'correct' && (
                      <p className="text-green-600 font-bold">+{feedback.points} נקודות! 💎</p>
                    )}
                    {feedback.type === 'wrong' && (
                      <p className="text-red-500 font-bold mt-1">
                        התשובה הנכונה: {feedback.correctAnswer} 💜
                      </p>
                    )}
                  </div>
                )}
              </div>
            </div>

            {/* Bottom mascot */}
            <div className="mt-4 animate-float text-5xl">
              {streak >= 5 ? '🦄' : streak >= 3 ? '🌟' : '🐱'}
            </div>
          </div>
        );
      }

      // ===== RESULT SCREEN =====
      if (screen === 'result') {
        const pct = Math.round((score / numQuestions) * 100);
        const passed = pct >= passPercent;
        const neededCorrect = Math.ceil(numQuestions * passPercent / 100);

        const getMessage = () => {
          if (pct === 100) return '🏆 מושלם!! 100%! אתם גאונים אמיתיים! 🏆';
          if (pct >= 90) return '🌟 מעולה! כמעט מושלם! 🌟';
          if (passed) return '⭐ יפה מאוד! עברתם את המשימה! ⭐';
          return null;
        };

        const getFailMessage = () => {
          if (pct >= passPercent - 10) return '💪 כמעט! עוד קצת ותצליחו!';
          if (pct >= 50) return '🌸 לא רע! נסו שוב!';
          return '💜 בואו ננסה שוב! אתם יכולים!';
        };

        // Auto-retry countdown for failed games
        useEffect(() => {
          if (screen === 'result' && !passed) {
            setRetryCountdown(5);
            const interval = setInterval(() => {
              setRetryCountdown(prev => {
                if (prev <= 1) {
                  clearInterval(interval);
                  startGame(selectedLevel);
                  return null;
                }
                return prev - 1;
              });
            }, 1000);
            return () => clearInterval(interval);
          }
        }, [screen]);

        return (
          <div className="min-h-screen p-4 flex flex-col items-center justify-center">
            <Confetti active={showConfetti} />

            <div className="w-full max-w-md animate-slideUp">
              <div className={`rounded-3xl shadow-2xl p-8 text-center ${
                passed
                  ? 'bg-gradient-to-br from-yellow-100 via-pink-50 to-purple-100'
                  : 'bg-white/90 backdrop-blur-md'
              }`}>
                {/* Score */}
                <div className="mb-4">
                  <span className={`text-8xl font-black ${pct === 100 ? 'animate-rainbow' : passed ? 'text-purple-600' : 'text-gray-500'}`}>
                    {pct}%
                  </span>
                </div>

                {passed ? (
                  <>
                    <StarRating score={pct} passPercent={passPercent} />
                    <p className="text-2xl font-bold text-gray-700 mb-2">{getMessage()}</p>
                  </>
                ) : (
                  <>
                    <div className="text-6xl mb-3">😢</div>
                    <p className="text-2xl font-bold text-gray-700 mb-2">{getFailMessage()}</p>
                    <p className="text-gray-500 mb-2">
                      היה צריך {neededCorrect} תשובות נכונות ({passPercent}%)
                    </p>
                  </>
                )}

                <div className="bg-purple-50 rounded-2xl p-4 mb-4 space-y-2">
                  <p className="text-lg">
                    ✅ תשובות נכונות: <span className="font-bold text-green-600">{score}/{numQuestions}</span>
                  </p>
                  <p className="text-lg">
                    🔥 רצף מקסימלי: <span className="font-bold text-orange-500">{maxStreak}</span>
                  </p>
                  <p className="text-lg">
                    📊 רמה: {selectedLevel.emoji} {selectedLevel.name}
                  </p>
                  <p className="text-lg">
                    🎯 נדרש: {passPercent}% ({neededCorrect} מתוך {numQuestions})
                  </p>
                </div>

                {passed && (
                  <div className="bg-green-100 rounded-2xl p-3 mb-4 border-2 border-green-300 animate-bounceIn">
                    <p className="text-green-700 font-bold text-lg">
                      🎉 כל הכבוד! עברתם את המשימה! 🎉
                    </p>
                  </div>
                )}

                {!passed && retryCountdown && (
                  <div className="bg-orange-100 rounded-2xl p-3 mb-4 border-2 border-orange-300 animate-bounceIn">
                    <p className="text-orange-700 font-bold text-lg">
                      🔄 משחקון חדש מתחיל בעוד {retryCountdown} שניות...
                    </p>
                  </div>
                )}

                <div className="flex gap-3 flex-wrap justify-center">
                  <button
                    onClick={() => startGame(selectedLevel)}
                    className="btn-option bg-gradient-to-r from-pink-500 to-purple-500 text-white
                               font-bold text-xl rounded-2xl px-6 py-3 shadow-lg hover:shadow-xl"
                  >
                    {passed ? '🔄 שחקו שוב' : '🔄 נסו שוב עכשיו'}
                  </button>
                  <button
                    onClick={goHome}
                    className="btn-option bg-gradient-to-r from-blue-400 to-cyan-400 text-white
                               font-bold text-xl rounded-2xl px-6 py-3 shadow-lg hover:shadow-xl"
                  >
                    🏠 דף הבית
                  </button>
                </div>
              </div>
            </div>

            {/* Celebration emojis */}
            {passed && (
              <div className="mt-6 flex gap-4 text-5xl">
                <span className="animate-float" style={{ animationDelay: '0s' }}>🎈</span>
                <span className="animate-float" style={{ animationDelay: '0.3s' }}>🎊</span>
                <span className="animate-float" style={{ animationDelay: '0.6s' }}>🎉</span>
                <span className="animate-float" style={{ animationDelay: '0.9s' }}>🎀</span>
                <span className="animate-float" style={{ animationDelay: '1.2s' }}>🦄</span>
              </div>
            )}
          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
